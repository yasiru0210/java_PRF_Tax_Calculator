<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payable Tax Calculator</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <a href="/" class="btn btn-back">← Back to Menu</a>
        
        <div class="calculator-form">
            <h2>Payable Tax Calculator</h2>
            
            <div class="info-card">
                <h4>Tax Brackets</h4>
                <ul>
                    <li>• Up to Rs. 100,000: No tax</li>
                    <li>• Rs. 100,001 - Rs. 141,667: 6%</li>
                    <li>• Rs. 141,668 - Rs. 183,333: 12%</li>
                    <li>• Rs. 183,334 - Rs. 225,000: 18%</li>
                    <li>• Rs. 225,001 - Rs. 266,667: 24%</li>
                    <li>• Rs. 266,668 - Rs. 308,333: 30%</li>
                    <li>• Above Rs. 308,333: 36%</li>
                </ul>
            </div>
            
            <div class="form-group">
                <label for="salary">Monthly Salary (Rs.):</label>
                <input type="number" id="salary" class="form-control" placeholder="Enter your monthly salary" min="0" step="0.01">
            </div>
            
            <div id="error-message"></div>
            
            <div class="form-group">
                <button type="button" class="btn btn-primary" onclick="calculatePayableTax()">Calculate Tax</button>
                <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset</button>
            </div>
            
            <div id="result"></div>
        </div>
    </div>
    
    <script th:src="@{/js/calculator.js}"></script>
</body>
</html>
